<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0c1115" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Winter Camp" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="wintercamp_icon.png">
  <link rel="stylesheet" href="styles.css" />
  <title>Winter Camp - إدارة التأجير</title>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button class="icon-btn" id="menuBtn" aria-label="القائمة">☰</button>
      <div class="brand-title">
        <img src="wintercamp_icon.png" alt="Winter Camp">
        <div><h1 id="pageTitle">الرئيسية</h1><p id="hijriToday"></p></div>
      </div>
      <button class="icon-btn" id="backupBtn" aria-label="نسخة احتياطية">⇩</button>
    </header>

    <main id="mainContent" class="content"></main>

    <button class="fab" id="fabBtn" aria-label="إضافة">＋</button>

    <nav class="bottom-nav" aria-label="التنقل الرئيسي">

  <button data-page="home" class="nav-item active">
    <span class="nav-svg">
      <svg viewBox="0 0 24 24">
        <path d="M3 10.5L12 3l9 7.5"/>
        <path d="M5 9.5V21h14V9.5"/>
        <path d="M9 21v-7h6v7"/>
      </svg>
    </span>
    <b>الرئيسية</b>
  </button>

  <button data-page="bookings" class="nav-item">
    <span class="nav-svg">
      <svg viewBox="0 0 24 24">
        <rect x="3" y="5" width="18" height="16" rx="2"/>
        <path d="M8 3v4M16 3v4M3 10h18"/>
        <path d="M8 15h3M8 18h6"/>
      </svg>
    </span>
    <b>الحجوزات</b>
  </button>

  <button data-page="expenses" class="nav-item">
    <span class="nav-svg">
      <svg viewBox="0 0 24 24">
        <rect x="3" y="6" width="18" height="14" rx="2"/>
        <path d="M3 10h18"/>
        <path d="M7 15h4"/>
      </svg>
    </span>
    <b>المصاريف</b>
  </button>

  <button data-page="reports" class="nav-item">
    <span class="nav-svg">
      <svg viewBox="0 0 24 24">
        <path d="M4 20V11"/>
        <path d="M10 20V5"/>
        <path d="M16 20v-8"/>
        <path d="M22 20H2"/>
      </svg>
    </span>
    <b>التقارير</b>
  </button>

</nav>
  </div>

  <div class="sheet-backdrop hidden" id="sheetBackdrop"></div>
  <aside class="side-sheet hidden" id="sideSheet">
    <div class="sheet-head">
      <img src="logo.png" alt="Winter Camp" class="sheet-logo" />
      <button class="icon-btn" id="closeMenu">×</button>
    </div>
    <button data-sheet-page="devices">الأجهزة</button>
    <button data-sheet-page="invoices">الفواتير</button>
    <button data-sheet-page="settings">الإعدادات</button>
    <button id="exportBtn">تصدير نسخة احتياطية</button>
    <label class="import-label">استيراد نسخة<input id="importInput" type="file" accept="application/json" hidden /></label>
  </aside>

  <div class="modal-backdrop hidden" id="modalBackdrop"></div>
  <section class="modal hidden" id="modal" role="dialog" aria-modal="true">
    <div class="modal-head"><h2 id="modalTitle"></h2><button id="modalClose" class="icon-btn">×</button></div>
    <div id="modalBody"></div>
  </section>

  <div id="toast" class="toast hidden"></div>
  <script src="app.js"></script>
</body>
</html>
