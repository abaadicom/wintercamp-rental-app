<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta
    name="theme-color"
    content="#0c1115">

  <meta
    name="apple-mobile-web-app-capable"
    content="yes">

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent">

  <meta
    name="apple-mobile-web-app-title"
    content="Winter Camp">

  <title>
    Winter Camp - إدارة التأجير
  </title>

  <link
    rel="manifest"
    href="manifest.webmanifest?v=20">

  <link
    rel="apple-touch-icon"
    href="wintercamp_icon.png?v=20">

  <link
    rel="icon"
    type="image/png"
    href="wintercamp_icon.png?v=20">

  <link
    rel="stylesheet"
    href="styles.css?v=20">

</head>


<body>


<header class="topbar">

  <div class="brand-title">

    <img
      src="wintercamp_icon.png?v=20"
      alt="Winter Camp"
      class="top-logo">

    <div>

      <h1 id="pageTitle">
        الرئيسية
      </h1>

      <p id="hijriToday">
        التاريخ الهجري
      </p>

    </div>

  </div>


  <button
    id="menuBtn"
    class="icon-btn">

    <svg
      viewBox="0 0 24 24"
      class="svg-icon">

      <path d="M4 6h16"/>
      <path d="M4 12h16"/>
      <path d="M4 18h16"/>

    </svg>

  </button>

</header>


<main
  id="mainContent"
  class="content">
</main>


<button
  id="fabBtn"
  class="fab">

  <svg
    viewBox="0 0 24 24"
    class="fab-icon">

    <path d="M12 5v14"/>
    <path d="M5 12h14"/>

  </svg>

</button>


<nav class="bottom-nav">


  <button
    class="nav-item active"
    data-page="home">

    <span class="nav-icon">

      <svg viewBox="0 0 24 24">

        <path d="M3 10.5L12 3l9 7.5"/>
        <path d="M5 9.5V21h14V9.5"/>
        <path d="M9 21v-7h6v7"/>

      </svg>

    </span>

    <b>
      الرئيسية
    </b>

  </button>


  <button
    class="nav-item"
    data-page="bookings">

    <span class="nav-icon">

      <svg viewBox="0 0 24 24">

        <rect
          x="3"
          y="5"
          width="18"
          height="16"
          rx="2"/>

        <path d="M8 3v4"/>
        <path d="M16 3v4"/>
        <path d="M3 10h18"/>

      </svg>

    </span>

    <b>
      الحجوزات
    </b>

  </button>


  <button
    class="nav-item"
    data-page="expenses">

    <span class="nav-icon">

      <svg viewBox="0 0 24 24">

        <rect
          x="3"
          y="6"
          width="18"
          height="14"
          rx="2"/>

        <path d="M3 10h18"/>
        <path d="M7 15h4"/>

      </svg>

    </span>

    <b>
      المصاريف
    </b>

  </button>


  <button
    class="nav-item"
    data-page="reports">

    <span class="nav-icon">

      <svg viewBox="0 0 24 24">

        <path d="M4 20V11"/>
        <path d="M10 20V5"/>
        <path d="M16 20v-8"/>
        <path d="M22 20H2"/>

      </svg>

    </span>

    <b>
      التقارير
    </b>

  </button>

</nav>


<div
  id="sheetBackdrop"
  class="sheet-backdrop hidden">
</div>


<aside
  id="sideSheet"
  class="side-sheet hidden">


  <div class="sheet-head">

    <img
      src="wintercamp_icon.png?v=20"
      class="sheet-logo"
      alt="Winter Camp">

    <button
      id="closeMenu"
      class="icon-btn">

      <svg
        viewBox="0 0 24 24"
        class="svg-icon">

        <path d="M6 6l12 12"/>
        <path d="M18 6L6 18"/>

      </svg>

    </button>

  </div>


  <button
    data-sheet-page="devices">

    <span class="side-icon">
      🔊
    </span>

    الأجهزة

  </button>


  <button
    data-sheet-page="invoices">

    <span class="side-icon">
      ▧
    </span>

    الفواتير

  </button>


  <button
    data-sheet-page="settings">

    <span class="side-icon">
      ⚙
    </span>

    الإعدادات

  </button>


  <button id="backupBtn">

    <span class="side-icon">
      ↓
    </span>

    نسخة احتياطية

  </button>


  <button id="exportBtn">

    <span class="side-icon">
      ⇩
    </span>

    تصدير البيانات

  </button>


  <label class="import-label">

    <span class="side-icon">
      ⇧
    </span>

    استيراد نسخة احتياطية

    <input
      id="importInput"
      type="file"
      accept=".json,application/json"
      hidden>

  </label>

</aside>


<div
  id="modalBackdrop"
  class="modal-backdrop hidden">
</div>


<section
  id="modal"
  class="modal hidden">


  <div class="modal-head">

    <h2 id="modalTitle">
      التفاصيل
    </h2>

    <button
      id="modalClose"
      class="icon-btn">

      <svg
        viewBox="0 0 24 24"
        class="svg-icon">

        <path d="M6 6l12 12"/>
        <path d="M18 6L6 18"/>

      </svg>

    </button>

  </div>


  <div id="modalBody">
  </div>

</section>


<div
  id="toast"
  class="toast hidden">
</div>


<script src="app.js?v=20"></script>

</body>

</html>
