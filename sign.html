<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>اعتماد عقد Winter Camp</title><style>body{margin:0;background:#eef4f0;font:16px system-ui,Tahoma;color:#1d3027}.wrap{max-width:700px;margin:25px auto;background:white;border-radius:18px;padding:24px;box-shadow:0 10px 35px #142b1b18}header{text-align:center;color:#086a3c}h1{font-size:24px}.item{border-bottom:1px solid #dce9e0;padding:12px 0;white-space:pre-wrap;overflow-wrap:anywhere}.terms{white-space:pre-wrap;background:#f4f7f4;padding:16px;border-radius:12px;line-height:1.8}button{background:#087346;color:white;border:0;border-radius:12px;padding:14px 18px;font-weight:bold;cursor:pointer}button:disabled{opacity:.5}label{display:block;margin:16px 0}.hidden{display:none}canvas{width:100%;height:160px;border:1px solid #a6b9ad;border-radius:10px;touch-action:none}#message{color:#b32b2b;font-weight:bold}small{color:#666}</style></head><body><main class="wrap"><header><h1>WINTER CAMP</h1><h2>اعتماد عقد تأجير معدات صوتية</h2></header><p id="message">جاري تحميل العقد…</p><section id="contract" class="hidden"><div class="item"><b>رقم العقد: </b><span id="number"></span></div><div class="item"><b>اسم المستأجر: </b><span id="name"></span></div><div class="item"><b>المعدات: </b><span id="equipment"></span></div><div class="item"><b>تفاصيل التأجير:</b><div id="details"></div></div><h3>الشروط والأحكام</h3><div class="terms" id="terms"></div><label><input type="checkbox" id="accepted"> قرأت بيانات العقد وشروطه وأوافق عليها</label><label>طريقة الاعتماد <select id="method"><option value="checkbox">الموافقة بعلامة صح</option><option value="signature">التوقيع بالإصبع</option></select></label><div id="signArea" class="hidden"><p>وقّع داخل المستطيل:</p><canvas id="pad" width="600" height="220"></canvas><button type="button" id="clear">مسح التوقيع</button></div><p><button type="button" id="approve">اعتماد العقد</button></p><small>رابط خاص. لا تشاركه مع أي شخص. سيتم تسجيل وقت الاعتماد وطريقته.</small></section></main><script src="sign.js?v=128"></script></body></html>
